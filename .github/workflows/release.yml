name: Release

# Push a tag like v0.3.1 (matching package.json) to publish:
# npm package, GitHub release with the Claude Desktop extension (.mcpb), MCP Registry entry.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing + MCP Registry OIDC login
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Trusted publishing (OIDC): no token. Configure once on npmjs.com →
      # package → Settings → Trusted Publisher → GitHub Actions, workflow release.yml.
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "fattureincloud-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "fattureincloud-mcp@$VERSION is already on npm, skipping"
            exit 0
          fi
          npm install -g npm@latest
          npm publish --access public

      - name: Build Claude Desktop extension
        run: npm run build:mcpb

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.mcpb \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: Prepare server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="fattureincloud-mcp-${VERSION}.mcpb"
          SHA=$(sha256sum "build/$FILE" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${FILE}"
          jq --arg v "$VERSION" --arg url "$URL" --arg sha "$SHA" '
            .version = $v
            | .packages[0].version = $v
            | .packages += [{
                registryType: "mcpb",
                identifier: $url,
                fileSha256: $sha,
                transport: { type: "stdio" },
                environmentVariables: .packages[0].environmentVariables
              }]' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Publish to MCP Registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
